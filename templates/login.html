{% extends "base.html" %}
{% block title %}Log In — ResumeAI{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-16 px-4">
  <div class="w-full max-w-md">

    <!-- Logo -->
    <div class="text-center mb-8">
      <a href="/" class="inline-flex items-center gap-2.5 justify-center">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center shadow-lg shadow-indigo-500/30">
          <i class="fa-solid fa-wand-magic-sparkles text-white"></i>
        </div>
        <span class="font-heading font-bold text-xl text-gray-900 dark:text-white">Resume<span class="text-indigo-600">AI</span></span>
      </a>
      <h1 class="font-heading text-2xl font-bold text-gray-900 dark:text-white mt-6 mb-2">Welcome back</h1>
      <p class="text-gray-500 dark:text-gray-400 text-sm">Log in to access your history and settings</p>
    </div>

    <!-- Card -->
    <div class="glass-card rounded-2xl p-8">
      <form action="/login" method="POST" class="space-y-5" id="login-form">
        <div>
          <label for="email" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1.5">Email address</label>
          <div class="relative">
            <i class="fa-solid fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
            <input type="email" id="email" name="email" required autocomplete="email"
              class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-200 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all outline-none"
              placeholder="you@example.com">
          </div>
        </div>

        <div>
          <div class="flex justify-between items-center mb-1.5">
            <label for="password" class="block text-sm font-semibold text-gray-700 dark:text-gray-300">Password</label>
            <a href="#" class="text-xs text-indigo-600 dark:text-indigo-400 hover:underline">Forgot password?</a>
          </div>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
            <input type="password" id="password" name="password" required autocomplete="current-password"
              class="w-full pl-10 pr-12 py-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-200 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all outline-none"
              placeholder="••••••••">
            <button type="button" id="toggle-pwd" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors">
              <i class="fa-solid fa-eye text-sm"></i>
            </button>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <input type="checkbox" id="remember" name="remember" class="w-4 h-4 accent-indigo-600 cursor-pointer">
          <label for="remember" class="text-sm text-gray-600 dark:text-gray-400 cursor-pointer select-none">Keep me signed in for 30 days</label>
        </div>

        <button type="submit" id="login-btn"
          class="btn-scale w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-sm shadow-indigo-500/25 hover:shadow-indigo-500/40 transition-all flex items-center justify-center gap-2">
          <i class="fa-solid fa-arrow-right-to-bracket"></i> Log In
        </button>
      </form>

      <!-- Demo credentials -->
      <div class="mt-5 p-3 bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800 rounded-xl text-xs text-amber-700 dark:text-amber-400">
        <i class="fa-solid fa-circle-info mr-1"></i>
        <strong>Admin demo:</strong> admin@resumeai.com / Admin@123
      </div>
    </div>

    <p class="text-center text-sm text-gray-500 dark:text-gray-400 mt-6">
      Don't have an account?
      <a href="/signup" class="text-indigo-600 dark:text-indigo-400 font-semibold hover:underline">Sign up free</a>
    </p>
  </div>
</div>

<script>
  document.getElementById('toggle-pwd').addEventListener('click', function() {
    const input = document.getElementById('password');
    const icon  = this.querySelector('i');
    const isHidden = input.type === 'password';
    input.type = isHidden ? 'text' : 'password';
    icon.className = `fa-solid fa-eye${isHidden ? '-slash' : ''} text-sm`;
  });
</script>
{% endblock %}
